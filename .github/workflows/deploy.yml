name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy to Render
        # Usamos un comando para notificar a Render que se despliegue
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK_URL }}